<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Weather Dashboard</h1>
  </header>

  <main>
    <section class="search-section">
      <form id="search-form">
        <input type="text" id="search-input" placeholder="Enter a city name" aria-label="City name" />
        <button type="submit">Search</button>
      </form>

      <p id="error-message" class="error-message"></p>
      <div id="loading-indicator" class="loading-indicator hidden">Loading weather data...</div>

      <div class="history-section">
        <h3>Search History</h3>
        <div id="history-container" class="history-container"></div>
      </div>
    </section>

    <section id="current-weather" class="current-weather-section">
      <h2 id="city-name">City Name (Date)</h2>
      <div class="weather-data">
        <p>Temperature: <span id="temperature">--</span> °C</p>
        <p>Humidity: <span id="humidity">--</span>%</p>
        <p>Wind Speed: <span id="wind-speed">--</span> m/s</p>
      </div>
    </section>

    <section id="forecast" class="forecast-section">
      <h2>5-Day Forecast</h2>
      <div id="forecast-container" class="forecast-cards-container"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
